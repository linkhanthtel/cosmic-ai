services:
  - type: web
    name: cosmic-ai
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Compute embeddings on Hugging Face servers instead of loading PyTorch
      # locally. Keeps memory well under 512MB so the app fits the starter plan.
      - key: EMBEDDINGS_BACKEND
        value: hf_api
      # Required for both hf_api embeddings AND the free HF chat LLM.
      - key: HF_TOKEN
        sync: false
      - key: HF_MODEL
        value: meta-llama/Llama-3.1-8B-Instruct
      - key: OPENAI_API_KEY
        sync: false
