<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}Cosmic AI{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        (function () {
            var stored = localStorage.getItem('cosmic-theme');
            var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root,
        [data-theme="dark"] {
            color-scheme: dark;
            --bg: #040810;
            --bg-elevated: #0a1222;
            --bg-sidebar: #060d18;
            --text-primary: #e8f0ff;
            --text-secondary: #8ba3c7;
            --text-muted: #5a7094;
            --accent: #4d9fff;
            --accent-hover: #6eb3ff;
            --accent-glow: rgba(77, 159, 255, 0.35);
            --accent-soft: rgba(77, 159, 255, 0.12);
            --accent-text: #040810;
            --border: rgba(100, 160, 255, 0.12);
            --border-strong: rgba(100, 160, 255, 0.22);
            --surface-hover: rgba(77, 159, 255, 0.08);
            --surface-active: rgba(77, 159, 255, 0.16);
            --overlay: rgba(2, 6, 16, 0.72);
            --shadow: rgba(0, 0, 0, 0.5);
            --grid-color: rgba(77, 159, 255, 0.04);
            --gradient-bg: radial-gradient(ellipse 80% 60% at 50% -20%, rgba(30, 80, 180, 0.18), transparent),
                           radial-gradient(ellipse 60% 40% at 100% 100%, rgba(20, 60, 140, 0.1), transparent);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }

        [data-theme="light"] {
            color-scheme: light;
            --bg: #f4f8ff;
            --bg-elevated: #ffffff;
            --bg-sidebar: #eef4fc;
            --text-primary: #0a1628;
            --text-secondary: #3d5a80;
            --text-muted: #6b85a8;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-glow: rgba(37, 99, 235, 0.25);
            --accent-soft: rgba(37, 99, 235, 0.08);
            --accent-text: #ffffff;
            --border: rgba(37, 99, 235, 0.12);
            --border-strong: rgba(37, 99, 235, 0.2);
            --surface-hover: rgba(37, 99, 235, 0.06);
            --surface-active: rgba(37, 99, 235, 0.1);
            --overlay: rgba(10, 22, 40, 0.25);
            --shadow: rgba(37, 99, 235, 0.08);
            --grid-color: rgba(37, 99, 235, 0.05);
            --gradient-bg: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(147, 197, 253, 0.35), transparent),
                           radial-gradient(ellipse 50% 40% at 0% 100%, rgba(191, 219, 254, 0.4), transparent);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }

        html {
            -webkit-text-size-adjust: 100%;
            height: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            background-image: var(--gradient-bg);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            min-height: 100dvh;
            transition: background 0.3s ease, color 0.3s ease;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 0;
            mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 20%, transparent 100%);
        }

        .app-container {
            display: flex;
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
            z-index: 1;
        }

        .sidebar {
            width: 240px;
            flex-shrink: 0;
            background: color-mix(in srgb, var(--bg-sidebar) 88%, transparent);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 100;
            transition: transform 0.25s ease, background 0.3s ease;
            padding-top: var(--safe-top);
            padding-left: var(--safe-left);
            box-shadow: 4px 0 24px var(--shadow);
        }

        .sidebar-header {
            padding: 20px 16px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h1 {
            font-family: 'Exo 2', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.2em;
            color: var(--accent);
            text-transform: uppercase;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .nav-menu {
            flex: 1;
            padding: 12px 10px;
            overflow-y: auto;
        }

        .nav-item {
            display: block;
            padding: 10px 14px;
            margin-bottom: 2px;
            border-radius: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
        }

        .nav-item:hover {
            background: var(--surface-hover);
            color: var(--accent);
        }

        .nav-item.active {
            background: var(--surface-active);
            color: var(--accent);
            box-shadow: inset 0 0 0 1px var(--border-strong), 0 0 16px var(--accent-glow);
        }

        .sidebar-footer {
            padding: 12px 10px calc(16px + var(--safe-bottom));
            border-top: 1px solid var(--border);
        }

        .theme-toggle {
            width: 100%;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            color: var(--text-secondary);
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
        }

        .theme-toggle:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            min-width: 0;
            width: 100%;
        }

        .mobile-menu-toggle {
            display: none;
            position: fixed;
            top: calc(12px + var(--safe-top));
            left: calc(12px + var(--safe-left));
            z-index: 200;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            color: var(--text-primary);
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .mobile-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--overlay);
            z-index: 150;
        }

        .mobile-overlay.show {
            display: block;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                width: min(280px, 85vw);
                transform: translateX(-100%);
                box-shadow: 4px 0 24px var(--shadow);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .mobile-menu-toggle {
                display: block;
                border-color: var(--border-strong);
                box-shadow: 0 0 12px var(--accent-glow);
            }

            .main-content {
                padding-top: calc(48px + var(--safe-top));
            }

            .page-chat .main-content {
                padding-top: 0;
            }

            .page-chat .mobile-menu-toggle {
                display: none;
            }
        }

        @media (min-width: 769px) {
            .mobile-overlay {
                display: none !important;
            }
        }

        @media (max-width: 480px) {
            .sidebar-header h1 {
                font-size: 13px;
            }

            .nav-item {
                font-size: 15px;
                padding: 12px 14px;
            }
        }

        {% block extra_css %}{% endblock %}
    </style>
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="app-container">
        <button type="button" class="mobile-menu-toggle" onclick="toggleSidebar()" aria-label="Open menu">Menu</button>
        <div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>

        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1>Cosmic AI</h1>
            </div>
            <div class="nav-menu">
                <a href="/chat" class="nav-item {% if request.url.path == '/chat' %}active{% endif %}">Chat</a>
                {% block nav_items %}{% endblock %}
            </div>
            <div class="sidebar-footer">
                <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle light or dark theme">
                    Switch to light mode
                </button>
            </div>
        </nav>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('mobileOverlay').classList.toggle('show');
        }

        document.querySelectorAll('.nav-item').forEach(function (item) {
            item.addEventListener('click', function () {
                if (window.innerWidth <= 768) toggleSidebar();
            });
        });

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('cosmic-theme', theme);
            var btn = document.getElementById('themeToggle');
            if (btn) {
                btn.textContent = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
            }
        }

        document.getElementById('themeToggle').addEventListener('click', function () {
            var current = document.documentElement.getAttribute('data-theme') || 'dark';
            applyTheme(current === 'dark' ? 'light' : 'dark');
        });

        (function () {
            var theme = document.documentElement.getAttribute('data-theme') || 'dark';
            applyTheme(theme);
        })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
