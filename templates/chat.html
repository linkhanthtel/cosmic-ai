{% extends "base.html" %}

{% block title %}AI Chat - Cosmic AI{% endblock %}
{% block body_class %}page-chat{% endblock %}

{% block extra_css %}
<style>
    .page-chat .app-container {
        height: 100vh;
        height: 100dvh;
        min-height: 0 !important;
        overflow: hidden;
    }

    .page-chat .main-content {
        min-height: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        width: 100%;
    }

    /* Full-width shell */
    .chat-layout {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        width: 100%;
        overflow: hidden;
    }

    /* Full-width header — spans entire main column */
    .chat-header {
        flex-shrink: 0;
        width: 100%;
        border-bottom: 1px solid var(--border);
        background: color-mix(in srgb, var(--bg-elevated) 85%, transparent);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 4px 24px var(--shadow);
    }

    .chat-header-inner {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: calc(12px + var(--safe-top)) max(16px, var(--safe-right)) 12px max(16px, var(--safe-left));
    }

    .chat-menu-btn {
        display: none;
        flex-shrink: 0;
        padding: 8px 12px;
        font-size: 13px;
        font-weight: 600;
        font-family: inherit;
        color: var(--text-primary);
        background: var(--bg-elevated);
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        cursor: pointer;
        transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
        box-shadow: 0 0 12px var(--accent-glow);
    }

    .chat-menu-btn:hover {
        border-color: var(--accent);
        background: var(--surface-hover);
        color: var(--accent);
    }

    .chat-header-title {
        flex: 1;
        min-width: 0;
        font-family: 'Exo 2', sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow: 0 0 24px var(--accent-glow);
    }

    .chat-header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
        margin-left: auto;
    }

    .btn-secondary {
        padding: 8px 14px;
        font-size: 11px;
        font-weight: 600;
        font-family: inherit;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-secondary);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 6px;
        cursor: pointer;
        transition: border-color 0.15s ease, color 0.15s ease;
        white-space: nowrap;
    }

    .btn-secondary:hover {
        border-color: var(--accent);
        color: var(--accent);
        box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Body fills remaining space */
    .chat-body {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        width: 100%;
        overflow: hidden;
    }

    .chat-messages {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        width: 100%;
        padding: 16px max(16px, var(--safe-right)) 16px max(16px, var(--safe-left));
        scroll-behavior: smooth;
        background: var(--bg);
    }

    .chat-messages-inner {
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
    }

    .chat-messages::-webkit-scrollbar {
        width: 6px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
        background: var(--border-strong);
        border-radius: 3px;
        box-shadow: inset 0 0 4px var(--accent-glow);
    }

    .message {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 14px;
    }

    .message.user {
        flex-direction: row-reverse;
    }

    .avatar {
        flex-shrink: 0;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Exo 2', sans-serif;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.05em;
        border: 1px solid var(--border);
    }

    .avatar.user {
        background: var(--surface-active);
        color: var(--accent);
        border-color: var(--border-strong);
        box-shadow: 0 0 12px var(--accent-glow);
    }

    .avatar.bot {
        background: var(--bg-elevated);
        color: var(--accent);
        border-color: var(--border-strong);
    }

    .message-content {
        max-width: min(85%, 520px);
        padding: 10px 14px;
        font-size: 14px;
        line-height: 1.55;
        border-radius: 10px;
        word-wrap: break-word;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
        border: 1px solid var(--border);
        transition: box-shadow 0.2s ease;
    }

    .message.user .message-content {
        background: var(--surface-active);
        color: var(--text-primary);
        border-color: var(--border-strong);
        box-shadow: 0 0 20px var(--accent-glow);
    }

    .message.bot .message-content {
        background: color-mix(in srgb, var(--bg-elevated) 90%, transparent);
        color: var(--text-secondary);
    }

    .welcome-message {
        text-align: center;
        padding: clamp(24px, 8vw, 48px) 16px;
        max-width: 420px;
        margin: 0 auto;
    }

    .welcome-message h2 {
        font-family: 'Exo 2', sans-serif;
        font-size: clamp(22px, 5vw, 28px);
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 12px;
        background: linear-gradient(135deg, var(--accent) 0%, var(--text-primary) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .welcome-message p {
        font-size: 14px;
        color: var(--text-muted);
        line-height: 1.65;
        margin: 0;
    }

    .welcome-message::before {
        content: '';
        display: block;
        font-size: 10px;
        color: var(--accent);
        letter-spacing: 0.5em;
        margin-bottom: 16px;
        opacity: 0.6;
        text-shadow: 0 0 12px var(--accent-glow);
    }

    .typing-indicator {
        display: none;
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 14px;
    }

    .typing-indicator.show {
        display: flex;
    }

    .typing-dots {
        display: flex;
        gap: 4px;
        padding: 10px 14px;
        background: var(--bg-elevated);
        border: 1px solid var(--border-strong);
        border-radius: 10px;
        box-shadow: 0 0 16px var(--accent-glow);
    }

    .typing-dot {
        width: 5px;
        height: 5px;
        background: var(--accent);
        border-radius: 50%;
        opacity: 0.35;
        box-shadow: 0 0 6px var(--accent-glow);
        animation: typing 1.2s infinite ease-in-out;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.3s; }

    @keyframes typing {
        0%, 80%, 100% { opacity: 0.25; }
        40% { opacity: 1; }
    }

    /* Full-width input bar */
    .chat-input-bar {
        flex-shrink: 0;
        width: 100%;
        padding: 12px max(16px, var(--safe-right)) calc(12px + var(--safe-bottom)) max(16px, var(--safe-left));
        border-top: 1px solid var(--border);
        background: color-mix(in srgb, var(--bg-elevated) 85%, transparent);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }

    .chat-input-inner {
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
    }

    .input-group {
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 6px 8px 6px 6px;
        background: var(--bg);
        min-height: 44px;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-group:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent), 0 0 20px var(--accent-glow);
    }

    .message-input {
        flex: 1 1 auto;
        min-width: 0;
        width: auto;
        border: none;
        outline: none;
        background: transparent;
        font-size: 14px;
        line-height: 1.4;
        color: var(--text-primary);
        resize: none;
        min-height: 24px;
        max-height: 120px;
        padding: 8px 4px;
        margin: 0;
        font-family: inherit;
        overflow-y: auto;
        field-sizing: content;
    }

    .message-input::placeholder {
        color: var(--text-muted);
    }

    .send-button {
        flex: 0 0 auto;
        align-self: center;
        height: 36px;
        padding: 0 14px;
        font-family: 'Exo 2', sans-serif;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--accent-text);
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        white-space: nowrap;
        transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
        box-shadow: 0 0 16px var(--accent-glow);
    }

    .send-button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 0 24px var(--accent-glow), 0 4px 12px var(--shadow);
    }

    .send-button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
    }

    .attach-button {
        flex: 0 0 auto;
        align-self: center;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        line-height: 1;
        color: var(--text-secondary);
        background: transparent;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    .attach-button:hover:not(:disabled) {
        color: var(--accent);
        background: var(--surface-hover);
        box-shadow: 0 0 12px var(--accent-glow);
    }

    .attach-button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
    }

    .file-input-hidden {
        display: none;
    }

    .attachment-preview-bar {
        display: none;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 8px;
    }

    .attachment-preview-bar.show {
        display: flex;
    }

    .attachment-chip {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg-elevated);
        max-width: 100%;
    }

    .attachment-chip-thumb {
        width: 44px;
        height: 44px;
        object-fit: cover;
        border-radius: 6px;
        flex-shrink: 0;
        background: var(--bg);
    }

    .attachment-chip video.attachment-chip-thumb {
        object-fit: cover;
    }

    .attachment-chip-meta {
        min-width: 0;
        flex: 1;
    }

    .attachment-chip-name {
        font-size: 12px;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 180px;
    }

    .attachment-chip-type {
        font-size: 10px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
    }

    .attachment-chip-remove {
        flex-shrink: 0;
        width: 24px;
        height: 24px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
    }

    .attachment-chip-remove:hover {
        color: var(--accent);
        background: var(--surface-hover);
    }

    .message-media {
        margin-top: 8px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .message-media img,
    .message-media video {
        max-width: 100%;
        max-height: 280px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
    }

    .message-media-label {
        font-size: 11px;
        color: var(--text-muted);
    }

    .upload-error {
        font-size: 12px;
        color: #f87171;
        margin-bottom: 8px;
        display: none;
    }

    .upload-error.show {
        display: block;
    }

    /* Tablet */
    @media (max-width: 1024px) {
        .chat-header-inner {
            padding-left: max(12px, var(--safe-left));
            padding-right: max(12px, var(--safe-right));
        }
    }

    /* Mobile */
    @media (max-width: 768px) {
        .page-chat .app-container {
            overflow: visible;
        }

        .chat-menu-btn {
            display: block;
        }

        .chat-header-inner {
            gap: 10px;
            padding-top: calc(10px + var(--safe-top));
            padding-bottom: 10px;
        }

        .chat-header-title {
            font-size: 12px;
        }

        .chat-messages {
            padding: 12px max(12px, var(--safe-left)) 12px max(12px, var(--safe-right));
        }

        .chat-input-bar {
            padding: 10px max(12px, var(--safe-left)) calc(10px + var(--safe-bottom)) max(12px, var(--safe-right));
        }

        .message-content {
            max-width: min(88%, 100%);
        }

        .message-input {
            font-size: 16px;
            padding: 10px 4px;
        }

        .input-group {
            gap: 6px;
            padding: 6px;
        }

        .avatar {
            width: 28px;
            height: 28px;
            font-size: 9px;
        }
    }

    /* Small phones */
    @media (max-width: 480px) {
        .chat-header-inner {
            gap: 8px;
        }

        .chat-menu-btn {
            padding: 7px 10px;
            font-size: 12px;
        }

        .btn-secondary {
            padding: 7px 10px;
            font-size: 10px;
        }

        .send-button {
            height: 34px;
            padding: 0 12px;
            font-size: 10px;
        }

        .attach-button {
            width: 34px;
            height: 34px;
            font-size: 18px;
        }
    }

    /* Large screens — header stays full, content centered */
    @media (min-width: 769px) {
        .chat-header-inner {
            padding-left: max(24px, var(--safe-left));
            padding-right: max(24px, var(--safe-right));
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="chat-layout">
    <header class="chat-header">
        <div class="chat-header-inner">
            <button type="button" class="chat-menu-btn" onclick="toggleSidebar()" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">Menu</button>
            <h2 class="chat-header-title">New Chat</h2>
            <div class="chat-header-actions">
                <button type="button" class="btn-secondary" onclick="clearChat()">Clear</button>
            </div>
        </div>
    </header>

    <div class="chat-body">
        <div class="chat-messages" id="chatContainer">
            <div class="chat-messages-inner">
                <div class="welcome-message">
                    <h2>Cosmic AI</h2>
                    <p>Ask me anything</p>
                </div>
                <div class="typing-indicator" id="typingIndicator">
                    <div class="avatar bot">AI</div>
                    <div class="typing-dots">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-input-bar">
            <div class="chat-input-inner">
                <div class="upload-error" id="uploadError"></div>
                <div class="attachment-preview-bar" id="attachmentPreview"></div>
                <div class="input-group">
                    <input
                        type="file"
                        id="fileInput"
                        class="file-input-hidden"
                        accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm,video/quicktime"
                        multiple
                        onchange="handleFileSelect(event)"
                    >
                    <button type="button" class="attach-button" id="attachButton" onclick="document.getElementById('fileInput').click()" aria-label="Attach image or video" title="Attach image or video">+</button>
                    <textarea
                        id="messageInput"
                        class="message-input"
                        placeholder="Type your message..."
                        rows="1"
                        onkeydown="handleKeyDown(event)"
                        oninput="autoResize(this)"
                        aria-label="Message input"
                    ></textarea>
                    <button type="button" class="send-button" id="sendButton" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let isTyping = false;
    let pendingAttachments = [];

    function handleKeyDown(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    }

    function autoResize(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    }

    function scrollToBottom() {
        var el = document.getElementById('chatContainer');
        el.scrollTop = el.scrollHeight;
    }

    function apiErrorMessage(data, status) {
        if (!data) return 'Request failed (' + status + ')';
        if (typeof data.detail === 'string') return data.detail;
        if (Array.isArray(data.detail)) {
            return data.detail.map(function (e) { return e.msg || JSON.stringify(e); }).join('; ');
        }
        return data.error || data.message || 'Request failed (' + status + ')';
    }

    function showUploadError(message) {
        var el = document.getElementById('uploadError');
        el.textContent = message;
        el.classList.add('show');
    }

    function clearUploadError() {
        var el = document.getElementById('uploadError');
        el.textContent = '';
        el.classList.remove('show');
    }

    function renderAttachmentPreview() {
        var bar = document.getElementById('attachmentPreview');
        bar.innerHTML = '';
        if (!pendingAttachments.length) {
            bar.classList.remove('show');
            return;
        }

        bar.classList.add('show');
        pendingAttachments.forEach(function (item, index) {
            var chip = document.createElement('div');
            chip.className = 'attachment-chip';

            if (item.media_type === 'image') {
                var img = document.createElement('img');
                img.className = 'attachment-chip-thumb';
                img.src = item.url;
                img.alt = item.name;
                chip.appendChild(img);
            } else {
                var video = document.createElement('video');
                video.className = 'attachment-chip-thumb';
                video.src = item.url;
                video.muted = true;
                chip.appendChild(video);
            }

            var meta = document.createElement('div');
            meta.className = 'attachment-chip-meta';
            meta.innerHTML =
                '<div class="attachment-chip-name">' + escapeHtml(item.name) + '</div>' +
                '<div class="attachment-chip-type">' + item.media_type + '</div>';
            chip.appendChild(meta);

            var removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'attachment-chip-remove';
            removeBtn.setAttribute('aria-label', 'Remove attachment');
            removeBtn.textContent = '×';
            removeBtn.onclick = function () {
                pendingAttachments = pendingAttachments.filter(function (a) {
                    return a.url !== item.url;
                });
                renderAttachmentPreview();
            };
            chip.appendChild(removeBtn);

            bar.appendChild(chip);
        });
    }

    function escapeHtml(text) {
        return String(text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function formatMessageHtml(message) {
        if (!message) return '';
        return escapeHtml(message)
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\n/g, '<br>');
    }

    function renderAttachmentsHtml(attachments) {
        if (!attachments || !attachments.length) return '';
        var html = '<div class="message-media">';
        attachments.forEach(function (item) {
            if (item.media_type === 'image') {
                html += '<img src="' + escapeHtml(item.url) + '" alt="' + escapeHtml(item.name || 'Image') + '">';
            } else {
                html += '<video src="' + escapeHtml(item.url) + '" controls playsinline preload="metadata"></video>';
            }
            if (item.name) {
                html += '<div class="message-media-label">' + escapeHtml(item.name) + '</div>';
            }
        });
        html += '</div>';
        return html;
    }

    function handleFileSelect(event) {
        var files = Array.from(event.target.files || []);
        event.target.value = '';
        if (!files.length) return;

        clearUploadError();
        var attachButton = document.getElementById('attachButton');
        attachButton.disabled = true;

        Promise.all(files.map(function (file) {
            var formData = new FormData();
            formData.append('file', file);
            return fetch('/upload', { method: 'POST', body: formData })
                .then(function (r) {
                    return r.json().then(function (data) {
                        if (!r.ok) throw new Error(apiErrorMessage(data, r.status));
                        return data;
                    });
                });
        }))
        .then(function (uploaded) {
            pendingAttachments = pendingAttachments.concat(uploaded);
            renderAttachmentPreview();
        })
        .catch(function (err) {
            showUploadError(err.message);
        })
        .finally(function () {
            attachButton.disabled = false;
        });
    }

    function sendMessage() {
        var messageInput = document.getElementById('messageInput');
        var sendButton = document.getElementById('sendButton');
        var message = messageInput.value.trim();
        var attachments = pendingAttachments.slice();
        if ((!message && !attachments.length) || isTyping) return;

        document.querySelector('.welcome-message')?.remove();
        addMessageToChat(message, 'user', attachments);
        messageInput.value = '';
        pendingAttachments = [];
        renderAttachmentPreview();
        autoResize(messageInput);
        showTypingIndicator();
        sendButton.disabled = true;
        document.getElementById('attachButton').disabled = true;

        fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: message, attachments: attachments })
        })
        .then(function (r) {
            return r.json().then(function (data) {
                if (!r.ok) throw new Error(apiErrorMessage(data, r.status));
                return data;
            });
        })
        .then(function (data) {
            hideTypingIndicator();
            addMessageToChat(data.response || 'No response.', 'bot');
        })
        .catch(function (err) {
            hideTypingIndicator();
            addMessageToChat('Error: ' + err.message, 'bot');
        })
        .finally(function () {
            sendButton.disabled = false;
            document.getElementById('attachButton').disabled = false;
            messageInput.focus();
        });
    }

    function clearChat() {
        pendingAttachments = [];
        renderAttachmentPreview();
        clearUploadError();
        fetch('/conversation/clear', { method: 'POST' })
            .then(function () {
                var inner = document.querySelector('.chat-messages-inner');
                var typingIndicator = document.getElementById('typingIndicator');
                inner.innerHTML = '';
                inner.appendChild(typingIndicator);
                var welcome = document.createElement('div');
                welcome.className = 'welcome-message';
                welcome.innerHTML = '<h2>Cosmic AI</h2><p>Ask me anything</p>';
                inner.insertBefore(welcome, typingIndicator);
            })
            .catch(function () {});
    }

    function showTypingIndicator() {
        isTyping = true;
        document.getElementById('typingIndicator').classList.add('show');
        scrollToBottom();
    }

    function hideTypingIndicator() {
        isTyping = false;
        document.getElementById('typingIndicator').classList.remove('show');
    }

    function addMessageToChat(message, sender, attachments) {
        var inner = document.querySelector('.chat-messages-inner');
        var typingIndicator = document.getElementById('typingIndicator');
        document.querySelector('.welcome-message')?.remove();

        var messageDiv = document.createElement('div');
        messageDiv.className = 'message ' + sender;

        var avatar = document.createElement('div');
        avatar.className = 'avatar ' + sender;
        avatar.textContent = sender === 'user' ? 'YOU' : 'AI';

        var content = document.createElement('div');
        content.className = 'message-content';
        var html = formatMessageHtml(message);
        if (attachments && attachments.length) {
            html += renderAttachmentsHtml(attachments);
        }
        if (!html) {
            html = renderAttachmentsHtml(attachments);
        }
        content.innerHTML = html;

        messageDiv.appendChild(avatar);
        messageDiv.appendChild(content);
        inner.insertBefore(messageDiv, typingIndicator);
        scrollToBottom();
    }

    window.onload = function () {
        document.getElementById('messageInput').focus();
    };
</script>
{% endblock %}
